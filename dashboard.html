<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LOVEQUEST MASTERS | RPGダッシュボード</title>
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
:root{
  --bg:#0D0D1A; --card:#1A1A35; --card2:#12122A;
  --gold:#F5A623; --red:#E94560; --blue:#4A9EDB;
  --green:#4CAF73; --purple:#7B5EA7;
  --white:#FFFFFF; --light:#E0E0E0; --muted:#8888AA;
  --se:#E94560; --od:#F5A623; --so:#4CAF73; --ma:#4A9EDB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Yu Gothic UI','Hiragino Sans','Meiryo',sans-serif;
  background:var(--bg);color:var(--light);min-height:100vh;overflow-x:hidden}

.portal-back{flex-shrink:0;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);
  border:1px solid #3a3a5a;border-radius:20px;padding:7px 14px;
  font-size:11.5px;color:var(--light);text-decoration:none}
.portal-back:hover{border-color:var(--gold);color:var(--gold)}

/* ─── MODAL ─── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#modal h2{color:var(--gold);font-size:22px;margin-bottom:4px;text-align:center}
#modal p{color:var(--muted);font-size:13px;margin-bottom:18px;text-align:center}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;width:100%}
.av-card{background:var(--card);border:1.5px solid #333;border-radius:10px;
  padding:10px 6px;text-align:center;cursor:pointer;transition:.15s}
.av-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.av-card .av-icon{display:block;margin:0 auto;width:38px;height:38px;object-fit:contain;border-radius:8px}
.av-card .av-icon.icon-fallback{font-size:28px;line-height:1.1;width:auto;height:auto}
.av-card .av-name{font-size:11px;font-weight:700;margin-top:5px;color:var(--white)}
.av-card.se{border-color:#333} .av-card.se:hover{border-color:var(--se)}
.av-card.od{border-color:#333} .av-card.od:hover{border-color:var(--od)}
.av-card.so{border-color:#333} .av-card.so:hover{border-color:var(--so)}
.av-card.ma{border-color:#333} .av-card.ma:hover{border-color:var(--ma)}

/* ─── HEADER ─── */
header{background:linear-gradient(135deg,#0D0D1A 0%,#1A0D2E 100%);
  border-bottom:1px solid #2a2a4a;padding:10px 16px;
  display:flex;align-items:center}
.hdr-side{flex:1;display:flex;align-items:center;gap:8px}
.hdr-side.right{justify-content:flex-end}
.logo{flex-shrink:0;font-size:18px;font-weight:900;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.logo span{color:var(--white)}
.hdr-right{display:flex;gap:8px;align-items:center}
.reset-btn{font-size:11px;padding:5px 10px;border-radius:8px;
  border:1px solid #444;background:transparent;color:var(--muted);cursor:pointer}
.reset-btn:hover{background:#333;color:var(--white)}
.save-btn{font-size:11px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.save-btn:hover{background:var(--gold);color:var(--bg)}
.load-btn{font-size:11px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer}
.load-btn:hover{background:var(--blue);color:var(--white)}

/* ─── LAYOUT ─── */
main{display:grid;grid-template-columns:220px 1fr 280px;gap:12px;
  padding:12px;max-width:1100px;margin:0 auto}
@media(max-width:860px){main{grid-template-columns:1fr 1fr}
  #quest-panel{grid-column:1/-1}}
@media(max-width:540px){main{grid-template-columns:1fr}
  #quest-panel{grid-column:auto}}
@media(max-width:600px){
  .portal-back{padding:6px 10px;font-size:10px}
  .portal-back .pb-txt{display:none}
}

/* ─── PANEL ─── */
.panel{background:var(--card);border:1px solid #2a2a4a;border-radius:14px;
  padding:14px;align-self:start}

/* ─── AVATAR PANEL ─── */
#avatar-panel{text-align:center}
.av-display{width:88px;height:88px;object-fit:contain;border-radius:14px;margin:8px auto;display:block}
.av-display.icon-fallback{font-size:62px;line-height:1;width:auto;height:auto}
.av-title{font-size:16px;font-weight:900;color:var(--gold)}
.av-sub{font-size:11px;color:var(--muted);margin-top:2px}
.change-btn{font-size:11px;padding:4px 10px;border-radius:8px;margin-top:8px;
  border:1px solid #444;background:transparent;color:var(--muted);cursor:pointer}
.change-btn:hover{border-color:var(--gold);color:var(--gold)}
.overall-box{margin-top:12px;background:var(--card2);border-radius:10px;padding:10px 12px;
  border:1px solid #2a2a4a}
.overall-lbl{font-size:11px;color:var(--muted);text-align:left}
.overall-lv{font-size:28px;font-weight:900;color:var(--gold);text-align:left;line-height:1.1}
.overall-title{font-size:12px;color:var(--muted);text-align:left;margin-bottom:6px}
.xp-bar-bg{height:8px;background:#2a2a4a;border-radius:4px;overflow:hidden;margin-top:6px}
.xp-bar-fill{height:100%;border-radius:4px;background:var(--purple);transition:width .5s ease}
.xp-txt{font-size:10px;color:var(--muted);margin-top:3px;text-align:right}

/* ─── COMMAND PANEL（RPGのコマンドウィンドウ風） ─── */
#command-panel h3{font-size:13px;font-weight:700;color:var(--white);margin-bottom:10px}
.cmd-item{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:6px;
  border:1.5px solid #3a3a5a;border-radius:8px;background:var(--card2);
  text-decoration:none;color:var(--light);cursor:pointer;transition:.12s}
.cmd-item:hover{border-color:var(--gold);background:#1e1e40}
.cmd-item:hover .cmd-arrow{color:var(--gold);transform:translateX(2px)}
.cmd-arrow{color:var(--muted);font-size:11px;flex-shrink:0;transition:.12s}
.cmd-text{font-size:12.5px;font-weight:700;color:var(--white)}
.cmd-sub{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:2px}
.cmd-item-disabled{cursor:default;opacity:.55}
.cmd-item-disabled:hover{border-color:#3a3a5a;background:var(--card2)}
.cmd-item-disabled:hover .cmd-arrow{color:var(--muted);transform:none}

/* ─── STATS ─── */
#stats-panel h3{font-size:13px;font-weight:700;color:var(--white);margin-bottom:12px}
.stat-row{margin-bottom:14px}
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.stat-name{font-size:12.5px;color:var(--light)}
.stat-lv{font-size:12px;font-weight:700}
.stat-bar-bg{height:12px;background:#2a2a4a;border-radius:6px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
.stat-adj{display:flex;gap:4px;margin-top:5px;justify-content:flex-end}
.adj-btn{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid #444;
  background:transparent;color:var(--muted);cursor:pointer;transition:.1s}
.adj-btn:hover{background:#333;color:var(--white)}
.stat-desc{font-size:10px;color:var(--muted);margin-top:2px}

.radar-wrap{margin-bottom:0;padding-bottom:0;border-bottom:none}
.analysis-row{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #2a2a4a}
.radar-svg{width:100%;height:auto;display:block;max-width:320px;margin:0 auto}
.radar-legend{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.radar-legend-row{display:flex;align-items:center;gap:8px}
.radar-legend-row .stat-name{flex:1}
.radar-legend-row .stat-adj{margin-top:0;display:flex;align-items:center;gap:6px}
.derived-note{font-size:10px;color:var(--muted);font-style:italic}
.impass-count{font-size:10px;color:var(--muted)}
.stats-sub-heading{font-size:11px;color:var(--muted);font-weight:700;margin:16px 0 10px;letter-spacing:.5px}
.manual-list{display:flex;flex-direction:column;gap:6px}
.manual-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--light);
  padding:6px 8px;border-radius:8px;border:1px solid #2a2a4a;background:var(--card2);cursor:pointer}
.manual-row.done{border-color:var(--green);color:var(--green)}
.manual-row input{flex-shrink:0}
.manual-name{flex:1}
.manual-target{font-size:10px;color:var(--muted)}
.manual-row.done .manual-target{color:var(--green)}

/* ─── QUESTS ─── */
#quest-panel h3{font-size:13px;font-weight:700;color:var(--white);margin-bottom:10px}
.q-item{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;
  border-radius:9px;margin-bottom:6px;cursor:pointer;
  border:1px solid #2a2a4a;background:var(--card2);transition:.15s}
.q-item:hover{border-color:#444}
.q-item.done{background:#0D1F0D;border-color:var(--green)}
.q-icon{font-size:18px;line-height:1;flex-shrink:0;margin-top:1px}
.q-body{flex:1;min-width:0}
.q-name{font-size:12.5px;font-weight:700;color:var(--light)}
.q-item.done .q-name{color:var(--green)}
.q-desc{font-size:10.5px;color:var(--muted);margin-top:2px}
.q-reward{font-size:10px;color:#888;margin-top:3px}
.q-check{font-size:18px;flex-shrink:0;margin-top:1px}
.q-item.done .q-check::before{content:'✅'}
.q-item:not(.done) .q-check::before{content:'⬜'}

/* ─── TOAST ─── */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  background:linear-gradient(135deg,#1A0D35,#2A1A55);
  border:2px solid var(--gold);border-radius:16px;padding:28px 40px;
  text-align:center;z-index:200;opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast .t-icon{font-size:48px}
#toast .t-title{font-size:22px;font-weight:900;color:var(--gold);margin:8px 0 4px}
#toast .t-sub{font-size:14px;color:var(--light)}
</style>
</head>
<body>

<!-- Avatar Selection Modal -->
<div id="modal">
  <h2>⚔️ アバターを選択してください</h2>
  <p>あなたの恋愛スタイルに近いキャラクターを選んで冒険を始めましょう</p>
  <div class="av-grid" id="av-grid"></div>
</div>

<!-- Header -->
<header>
  <div class="hdr-side left"><a class="portal-back" href="index.html">← <span class="pb-txt">ポータルへ戻る</span></a></div>
  <div class="logo">LOVE<span>QUEST</span> <span style="font-size:12px;color:var(--muted)">MASTERS</span></div>
  <div class="hdr-side right">
    <div class="hdr-right">
      <button class="save-btn" onclick="saveBookFile()">📖 冒険の書を保存</button>
      <button class="load-btn" onclick="document.getElementById('bookFileInput').click()">📂 読込</button>
      <input type="file" id="bookFileInput" accept=".md,text/markdown" style="display:none" onchange="loadBookFile(this.files[0])">
      <button class="reset-btn" onclick="resetAll()">🔄 リセット</button>
      <button class="reset-btn" id="reloadBtn">🔄 RELOAD</button>
    </div>
  </div>
</header>

<!-- Main -->
<main>
  <!-- Avatar Panel -->
  <div class="panel" id="avatar-panel">
    <div class="av-display" id="av-icon">🧙</div>
    <div class="av-title" id="av-name">魔法戦士</div>
    <div class="av-sub" id="av-sub">戦士 × 魔法使い</div>
    <button class="change-btn" onclick="openModal()">✏️ 変更</button>
    <div class="overall-box">
      <div class="overall-lbl">総合レベル</div>
      <div class="overall-lv" id="ov-lv">Lv.1</div>
      <div class="overall-title" id="ov-rank">見習い冒険者</div>
      <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
      <div class="xp-txt" id="xp-txt">0 / 100 XP</div>
    </div>
  </div>

  <!-- Command Panel -->
  <div class="panel" id="command-panel">
    <h3>⚔️ コマンド</h3>
    <a class="cmd-item" href="https://gitmind.com/jp/" target="_blank" rel="noopener">
      <span class="cmd-arrow">▶</span>
      <span class="cmd-text">マインドマップ<span class="cmd-sub">（事前準備）</span></span>
    </a>
    <div class="cmd-item cmd-item-disabled">
      <span class="cmd-arrow">▶</span>
      <span class="cmd-text">デートログ<span class="cmd-sub">（事後振り返り）</span></span>
    </div>
    <a class="cmd-item" href="https://fants.jp/accounts/sign_in" target="_blank" rel="noopener">
      <span class="cmd-arrow">▶</span>
      <span class="cmd-text">FANTSの扉<span class="cmd-sub">（BrightForMen）</span></span>
    </a>
  </div>

  <!-- Stats Panel -->
  <div class="panel" id="stats-panel">
    <h3>📊 ステータス</h3>
    <div id="stats-container"></div>
  </div>

  <!-- Quest Panel -->
  <div class="panel" id="quest-panel">
    <h3>⚔️ クエスト <span id="q-count" style="font-size:11px;color:var(--muted);font-weight:400"></span></h3>
    <div id="quest-container"></div>
  </div>
</main>

<!-- Level Up Toast -->
<div id="toast">
  <div class="t-icon">🌟</div>
  <div class="t-title" id="toast-title">LEVEL UP!</div>
  <div class="t-sub" id="toast-sub">Lv.2 に上がりました</div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────
const AVATARS = [
  {name:'狂戦士',icon:'⚔️',file:'kyousenshi',type:'se',sub:'戦士ド直球'},
  {name:'勇者',  icon:'🦸',file:'yuusha',type:'se',sub:'戦士 × 踊り子'},
  {name:'魔法戦士',icon:'🧙',file:'mahousenshi',type:'se',sub:'戦士 × 魔法使い'},
  {name:'聖戦士',icon:'🛡️',file:'seisenshi',type:'se',sub:'戦士 × 僧侶'},
  {name:'姫',   icon:'👸',file:'hime',type:'od',sub:'踊り子ド直球'},
  {name:'騎士',  icon:'🏇',file:'kishi',type:'od',sub:'踊り子 × 戦士'},
  {name:'盗賊',  icon:'🗡️',file:'touzoku',type:'od',sub:'踊り子 × 魔法使い'},
  {name:'妖精',  icon:'🧚',file:'yousei',type:'od',sub:'踊り子 × 僧侶'},
  {name:'シスター',icon:'🌿',file:'sister',type:'so',sub:'僧侶ド直球'},
  {name:'兵士',  icon:'🪖',file:'heishi',type:'so',sub:'僧侶 × 戦士'},
  {name:'牧師',  icon:'📖',file:'bokushi',type:'so',sub:'僧侶 × 踊り子'},
  {name:'賢者',  icon:'🦉',file:'kenja',type:'so',sub:'僧侶 × 魔法使い'},
  {name:'魔道士',icon:'🔮',file:'madoushi',type:'ma',sub:'魔法使いド直球'},
  {name:'忍者',  icon:'🥷',file:'ninja',type:'ma',sub:'魔法使い × 戦士'},
  {name:'道化師',icon:'🎭',file:'doukeshi',type:'ma',sub:'魔法使い × 踊り子'},
  {name:'占い師',icon:'⭐',file:'uranaishi',type:'ma',sub:'魔法使い × 僧侶'},
];

// avatarフォルダのPNGを参照（差し替え可能）。読み込み失敗時は絵文字にフォールバック
function iconImg(t, cls){
  const c = cls ? `icon ${cls}` : 'icon';
  return `<img class="${c}" src="avatar/${t.file}.png" alt="${t.name}" `
    + `onerror="this.outerHTML='<span class=&quot;${c} icon-fallback&quot;>${t.icon}</span>'">`;
}

// レーダーチャート(6軸・上から時計回り)。メンタル/魅了力/分析力は他ステータスから自動計算される派生値
const RADAR_STATS = [
  {key:'メンタル',icon:'🛡️',color:'#4A9EDB', desc:'認識力が上がると連動して上がる（自動計算）', derived:true},
  {key:'外見力', icon:'✨', color:'#E94560', desc:'ファッション講座・身だしなみ・清潔感（洋服を新調するとUP）'},
  {key:'デート力',icon:'🗺️',color:'#F5A623', desc:'デートの回数・報告分析・デートマインドマップ作成でUP'},
  {key:'コミュ力',icon:'💬',color:'#4CAF73', desc:'マニュアルのインプット・アウトプットでUP'},
  {key:'魅了力', icon:'💫', color:'#7B5EA7', desc:'認識力・表現力・楽転力・共感力の経験値＋マニュアル受講チェックで上がる（自動計算）', derived:true},
  {key:'経験値', icon:'🌟', color:'#8888AA', desc:'デート実施などOUTPUT（実際の行動）で上がる（自動計算）', derived:true},
];
// レーダーチャートの外に置く追加の派生ステータス（分析力）
const ANALYSIS_STAT = {key:'分析力', icon:'🧠', color:'#4A9EDB', desc:'インパス診断ツールの使用回数で上がる（自動計算）', derived:true};
// マニュアル受講チェックリスト。チェックすると対象ステータスに+10（外すと-10）
const MANUAL_COURSES = [
  {key:'認識力', name:'LCIQ認識力向上マニュアル'},
  {key:'表現力', name:'表現力アップ講座'},
  {key:'楽転力', name:'楽転力（ポジティブ変換）講座'},
  {key:'共感力', name:'共感力向上講座'},
  {key:'行動力', name:'行動力アップ講座'},
  {key:'包容力', name:'包容力向上講座'},
  {key:'継続力', name:'継続力アップ講座'},
];
// レーダーチャート対象外の追加ステータス
const EXTRA_STATS = [
  {key:'認識力', icon:'👁️', color:'#E94560', desc:'LCIQ診断など。上がるとメンタル力が連動して上がる'},
  {key:'表現力', icon:'🎤', color:'#F5A623', desc:'気持ちや考えを言葉・態度で伝える力。魅了力の経験値になる'},
  {key:'楽転力', icon:'🔄', color:'#4CAF73', desc:'落ち込みや失敗を前向きに切り替える力。魅了力の経験値になる'},
  {key:'共感力', icon:'🤝', color:'#4A9EDB', desc:'相手の気持ちに寄り添い理解する力。魅了力の経験値になる'},
  {key:'行動力', icon:'🏃', color:'#E94560', desc:'迷わず一歩を踏み出す力'},
  {key:'包容力', icon:'🌿', color:'#F5A623', desc:'相手をありのまま受け止める力'},
  {key:'継続力', icon:'🔥', color:'#4CAF73', desc:'コツコツ続け、習慣化する力'},
];
const STATS = [...RADAR_STATS.filter(s=>!s.derived), ...EXTRA_STATS];

function statValue(key){
  if(key==='メンタル') return Math.min(100, state.stats['認識力']||0);
  if(key==='魅了力'){
    const src=['認識力','表現力','楽転力','共感力'];
    const avg = src.reduce((s,k)=>s+(state.stats[k]||0),0)/src.length;
    // マニュアル受講チェックリストで認識力・表現力・楽転力・共感力を受講済みなら追加ボーナス
    const checkedBonus = (state.manualDone||[]).filter(k=>src.includes(k)).length * 15;
    return Math.min(100, Math.round(avg + checkedBonus));
  }
  if(key==='経験値') return Math.min(100, Math.round(totalXP()/3200*100) + (state.mindmapCount||0)*5);
  if(key==='分析力') return Math.min(100, (state.impassCount||0)*10);
  return Math.min(100, state.stats[key]||0);
}

const QUESTS = [
  {name:'タイプ診断マスター',   desc:'恋愛式学16タイプを理解する', icon:'🔮',xp:100, reward:{コミュ力:15,共感力:10}},
  {name:'プロフィール写真改善', desc:'外見力基礎講座を完了',        icon:'📸',xp:80,  reward:{外見力:20}},
  {name:'外見力 Lv.3 達成',    desc:'外見スコア30以上を達成',       icon:'✨',xp:120, reward:{外見力:10,表現力:5}},
  {name:'マッチングアプリ登録', desc:'アプリを始める第一歩',         icon:'📱',xp:50,  reward:{コミュ力:10}},
  {name:'初メッセージ送信',    desc:'相手にメッセージを送る',        icon:'💬',xp:80,  reward:{コミュ力:15,デート力:5}},
  {name:'初回デート成功',      desc:'初めてのデートを完了',          icon:'☕',xp:200, reward:{デート力:25,共感力:15}},
  {name:'2回目デートOK',       desc:'相手から2回目の承諾を得る',     icon:'🌟',xp:250, reward:{楽転力:20,デート力:15}},
  {name:'コミュ力 Lv.5 達成',  desc:'コミュスコア50以上を達成',      icon:'💫',xp:150, reward:{コミュ力:10,共感力:10}},
  {name:'デート力 Lv.5 達成',  desc:'デートスコア50以上を達成',      icon:'🗺️',xp:150, reward:{デート力:10,表現力:10}},
  {name:'交際スタート',        desc:'パートナーと付き合い始める',     icon:'💑',xp:500, reward:{外見力:10,デート力:10,共感力:10,コミュ力:10}},
];

const LV_THRESHOLDS = [0,100,250,450,700,1000,1400,1900,2500,3200];
const LV_RANKS = ['見習い冒険者','新米冒険者','駆け出し冒険者','一人前冒険者',
  '熟練冒険者','上級冒険者','エリート冒険者','魔剣士','伝説の恋愛師','恋愛の覇者'];

// ─── STATE ──────────────────────────────────────────
let state = {
  avatarIdx: 2,
  stats: Object.fromEntries(STATS.map(s => [s.key, 0])),
  impassCount: 0,
  mindmapCount: 0,
  manualDone: [],
  done: [],
};
function save(){ localStorage.setItem('lqm', JSON.stringify(state)); }
// 読み込んだstateに不足フィールドを補完する（旧セーブデータ・他バージョンの冒険の書ファイルにも対応）。
// 今後ステータスやチェックリストが増減しても、ここを直せば読み込み側は壊れない。
function normalizeState(s){
  s = s && typeof s === 'object' ? s : {};
  s.stats = Object.assign(Object.fromEntries(STATS.map(x => [x.key, 0])), s.stats || {});
  if(typeof s.impassCount !== 'number') s.impassCount = 0;
  if(typeof s.mindmapCount !== 'number') s.mindmapCount = 0;
  if(!Array.isArray(s.manualDone)) s.manualDone = [];
  if(!Array.isArray(s.done)) s.done = [];
  if(typeof s.avatarIdx !== 'number') s.avatarIdx = 2;
  return s;
}
function load(){
  const d = localStorage.getItem('lqm');
  if(d){ try{ state = JSON.parse(d); }catch(e){} }
  state = normalizeState(state);
}

// ─── LEVEL CALC ─────────────────────────────────────
function totalXP(){ return QUESTS.reduce((s,q,i)=>s+(state.done.includes(i)?q.xp:0),0); }
function calcLv(xp){
  for(let i=LV_THRESHOLDS.length-1;i>=0;i--) if(xp>=LV_THRESHOLDS[i]) return i+1;
  return 1;
}
function statLv(v){ return Math.min(10,Math.floor(v/10)+1); }

// ─── RENDER ─────────────────────────────────────────
function renderAvatar(){
  const av = AVATARS[state.avatarIdx];
  document.getElementById('av-icon').outerHTML = iconImg(av, 'av-display').replace('class="icon av-display"','class="icon av-display" id="av-icon"');
  document.getElementById('av-name').textContent = av.name;
  document.getElementById('av-sub').textContent  = av.sub;
}

function renderOverall(){
  const xp  = totalXP();
  const lv  = calcLv(xp);
  const nxt = LV_THRESHOLDS[Math.min(lv, LV_THRESHOLDS.length-1)];
  const prv = LV_THRESHOLDS[lv-1] || 0;
  const pct = nxt > prv ? Math.round((xp-prv)/(nxt-prv)*100) : 100;
  document.getElementById('ov-lv').textContent    = 'Lv.' + lv;
  document.getElementById('ov-rank').textContent  = LV_RANKS[lv-1] || LV_RANKS[LV_RANKS.length-1];
  document.getElementById('xp-bar').style.width   = pct + '%';
  document.getElementById('xp-txt').textContent   = xp + ' / ' + nxt + ' XP';
}

function radarSVG(){
  const w = 320, h = 260, cx = w/2, cy = h/2, r = 68;
  const n = RADAR_STATS.length;
  const angle = i => (Math.PI*2/n)*i - Math.PI/2;
  const pt = (i, frac) => [cx + Math.cos(angle(i))*r*frac, cy + Math.sin(angle(i))*r*frac];
  let rings = '';
  [0.25,0.5,0.75,1].forEach(frac => {
    const pts = RADAR_STATS.map((_,i)=>pt(i,frac).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="#2a2a4a" stroke-width="1"/>`;
  });
  let axes = '';
  RADAR_STATS.forEach((_,i) => {
    const [x,y] = pt(i,1);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2a2a4a" stroke-width="1"/>`;
  });
  const dataPts = RADAR_STATS.map((st,i)=>pt(i, statValue(st.key)/100).join(',')).join(' ');
  let labels = '';
  RADAR_STATS.forEach((st,i) => {
    const [x,y] = pt(i,1.45);
    const val = statValue(st.key);
    const dx = Math.cos(angle(i));
    const anchor = dx > 0.3 ? 'start' : dx < -0.3 ? 'end' : 'middle';
    labels += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle"
      font-size="11" fill="${st.color}" font-weight="700">${st.icon} ${st.key}</text>
      <text x="${x}" y="${y+13}" text-anchor="${anchor}" font-size="9" fill="#8888AA">${val}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="radar-svg">
    ${rings}${axes}
    <polygon points="${dataPts}" fill="rgba(245,166,35,.28)" stroke="var(--gold)" stroke-width="2"/>
    ${labels}
  </svg>`;
}

function renderStats(){
  const c = document.getElementById('stats-container');
  c.innerHTML = '';

  const radarWrap = document.createElement('div');
  radarWrap.className = 'radar-wrap';
  radarWrap.innerHTML = radarSVG() + `<div class="radar-legend">${RADAR_STATS.map(st => {
    const val = statValue(st.key);
    let ctrl;
    if(st.key==='経験値'){
      ctrl = `<div class="stat-adj">
        <span class="impass-count">MM${state.mindmapCount||0}回</span>
        <button class="adj-btn" onclick="useMindmap()">🗺️ +1回</button>
      </div>`;
    } else if(st.derived){
      ctrl = `<div class="stat-adj"><span class="derived-note">自動計算</span></div>`;
    } else {
      ctrl = `<div class="stat-adj">
        <button class="adj-btn" onclick="adjStat('${st.key}',-10)">−10</button>
        <button class="adj-btn" onclick="adjStat('${st.key}',+10)">+10</button>
      </div>`;
    }
    return `<div class="radar-legend-row">
      <span class="stat-name">${st.icon} ${st.key}</span>
      <span class="stat-lv" style="color:${st.color}">Lv.${statLv(val)}</span>
      ${ctrl}
    </div>`;
  }).join('')}</div>`;
  c.appendChild(radarWrap);

  const analysisRow = document.createElement('div');
  analysisRow.className = 'radar-legend-row analysis-row';
  {
    const val = statValue(ANALYSIS_STAT.key);
    analysisRow.innerHTML = `
      <span class="stat-name">${ANALYSIS_STAT.icon} ${ANALYSIS_STAT.key}</span>
      <span class="stat-lv" style="color:${ANALYSIS_STAT.color}">Lv.${statLv(val)}</span>
      <div class="stat-adj">
        <span class="impass-count">インパス${state.impassCount||0}回</span>
        <button class="adj-btn" onclick="useImpass()">🔮 +1回</button>
      </div>`;
  }
  c.appendChild(analysisRow);

  const extraHeading = document.createElement('div');
  extraHeading.className = 'stats-sub-heading';
  extraHeading.textContent = '追加ステータス';
  c.appendChild(extraHeading);

  EXTRA_STATS.forEach(st => {
    const val  = Math.min(100, state.stats[st.key] || 0);
    const lv   = statLv(val);
    const div  = document.createElement('div');
    div.className = 'stat-row';
    div.innerHTML = `
      <div class="stat-head">
        <span class="stat-name">${st.icon} ${st.key}</span>
        <span class="stat-lv" style="color:${st.color}">Lv.${lv}</span>
      </div>
      <div class="stat-bar-bg">
        <div class="stat-bar-fill" style="width:${val}%;background:${st.color}"></div>
      </div>
      <div class="stat-desc">${st.desc}</div>
      <div class="stat-adj">
        <button class="adj-btn" onclick="adjStat('${st.key}',-10)">−10</button>
        <button class="adj-btn" onclick="adjStat('${st.key}',+10)">+10</button>
      </div>`;
    c.appendChild(div);
  });

  const manualHeading = document.createElement('div');
  manualHeading.className = 'stats-sub-heading';
  manualHeading.textContent = '📚 マニュアル受講チェックリスト（受講で+10）';
  c.appendChild(manualHeading);

  const manualList = document.createElement('div');
  manualList.className = 'manual-list';
  MANUAL_COURSES.forEach(m => {
    const checked = state.manualDone.includes(m.key);
    const row = document.createElement('label');
    row.className = 'manual-row' + (checked ? ' done' : '');
    row.innerHTML = `<input type="checkbox" ${checked?'checked':''} onchange="toggleManual('${m.key}')">
      <span class="manual-name">${m.name}</span>
      <span class="manual-target">→ ${m.key}</span>`;
    manualList.appendChild(row);
  });
  c.appendChild(manualList);
}

function renderQuests(){
  const c  = document.getElementById('quest-container');
  const qc = document.getElementById('q-count');
  c.innerHTML = '';
  qc.textContent = `${state.done.length} / ${QUESTS.length} 完了`;
  QUESTS.forEach((q,i) => {
    const done = state.done.includes(i);
    const rewardTxt = Object.entries(q.reward).map(([k,v])=>`${k}+${v}`).join(' / ');
    const div = document.createElement('div');
    div.className = 'q-item' + (done?' done':'');
    div.innerHTML = `
      <span class="q-icon">${q.icon}</span>
      <div class="q-body">
        <div class="q-name">${q.name}</div>
        <div class="q-desc">${q.desc}</div>
        <div class="q-reward">🎁 ${rewardTxt}  (+${q.xp} XP)</div>
      </div>
      <span class="q-check"></span>`;
    div.onclick = () => toggleQuest(i);
    c.appendChild(div);
  });
}

function renderAll(){
  renderAvatar();
  renderOverall();
  renderStats();
  renderQuests();
}

// ─── ACTIONS ────────────────────────────────────────
function toggleQuest(i){
  const prevLv = calcLv(totalXP());
  const q = QUESTS[i];
  const doneIdx = state.done.indexOf(i);
  if(doneIdx >= 0){
    state.done.splice(doneIdx,1);
    Object.entries(q.reward).forEach(([k,v])=>{ state.stats[k] = Math.max(0,(state.stats[k]||0)-v); });
  } else {
    state.done.push(i);
    Object.entries(q.reward).forEach(([k,v])=>{ state.stats[k] = Math.min(100,(state.stats[k]||0)+v); });
  }
  save();
  renderAll();
  const newLv = calcLv(totalXP());
  if(newLv > prevLv) showLevelUp(newLv);
}

function adjStat(key, delta){
  state.stats[key] = Math.max(0, Math.min(100, (state.stats[key]||0) + delta));
  save(); renderStats(); renderOverall();
}
function useImpass(){
  state.impassCount = (state.impassCount||0) + 1;
  save(); renderStats(); renderOverall();
}
function useMindmap(){
  state.mindmapCount = (state.mindmapCount||0) + 1;
  save(); renderStats(); renderOverall();
}
function toggleManual(key){
  const idx = state.manualDone.indexOf(key);
  if(idx >= 0){
    state.manualDone.splice(idx,1);
    state.stats[key] = Math.max(0, (state.stats[key]||0) - 10);
  } else {
    state.manualDone.push(key);
    state.stats[key] = Math.min(100, (state.stats[key]||0) + 10);
  }
  save(); renderStats(); renderOverall();
}

function showLevelUp(lv){
  const t = document.getElementById('toast');
  document.getElementById('toast-title').textContent = '🌟 LEVEL UP!';
  document.getElementById('toast-sub').textContent   = `Lv.${lv} 「${LV_RANKS[lv-1]}」に昇格！`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

// ─── AVATAR MODAL ────────────────────────────────────
function openModal(){
  document.getElementById('modal').style.display = 'flex';
}
function buildModal(){
  const g = document.getElementById('av-grid');
  g.innerHTML = '';
  AVATARS.forEach((av,i) => {
    const d = document.createElement('div');
    d.className = `av-card ${av.type}`;
    d.innerHTML = `${iconImg(av,'av-icon')}<div class="av-name">${av.name}</div>`;
    d.onclick = () => selectAvatar(i);
    g.appendChild(d);
  });
}
function selectAvatar(i){
  state.avatarIdx = i;
  save();
  document.getElementById('modal').style.display = 'none';
  renderAvatar();
}

// ─── RESET ──────────────────────────────────────────
function resetAll(){
  if(!confirm('すべてのステータス・クエスト達成状況・チェックリストをリセットします。よろしいですか？\n（アバターの選択は保持されます）')) return;
  state = normalizeState({avatarIdx: state.avatarIdx});
  save(); renderAll();
  alert('リセットしました🔄');
}

// ─── 冒険の書（ファイル保存・読込） ───────────────────
// 見た目はMarkdownの「冒険の書」、中身はJSONのセーブデータをそのまま埋め込む。
// ステータスやチェックリストの項目が増減しても、STATS/RADAR_STATS/MANUAL_COURSES/QUESTSを
// 動的に参照しているので出力側は自動的に追従する。読込側はJSONブロックのみを見るので壊れない。
function buildBookMarkdown(){
  const av = AVATARS[state.avatarIdx];
  const xp = totalXP();
  const lv = calcLv(xp);
  const lines = [];
  lines.push(`# 🗺️ 冒険の書 — ${av.name}`);
  lines.push('');
  lines.push(`> 保存日時: ${new Date().toLocaleString('ja-JP')}`);
  lines.push('');
  lines.push(`## 総合レベル`);
  lines.push(`Lv.${lv}（${LV_RANKS[lv-1]||LV_RANKS[LV_RANKS.length-1]}） — ${xp} XP`);
  lines.push('');
  lines.push(`## ステータス`);
  RADAR_STATS.forEach(st => {
    lines.push(`- ${st.icon} ${st.key}: Lv.${statLv(statValue(st.key))}（${statValue(st.key)}）${st.derived?'（自動計算）':''}`);
  });
  lines.push(`- ${ANALYSIS_STAT.icon} ${ANALYSIS_STAT.key}: Lv.${statLv(statValue(ANALYSIS_STAT.key))}（${statValue(ANALYSIS_STAT.key)}）（自動計算）`);
  lines.push('');
  lines.push(`## 追加ステータス`);
  EXTRA_STATS.forEach(st => {
    lines.push(`- ${st.icon} ${st.key}: Lv.${statLv(state.stats[st.key]||0)}（${state.stats[st.key]||0}）`);
  });
  lines.push('');
  lines.push(`## マニュアル受講チェックリスト`);
  MANUAL_COURSES.forEach(m => {
    lines.push(`- [${state.manualDone.includes(m.key)?'x':' '}] ${m.name}`);
  });
  lines.push('');
  lines.push(`## クエスト（${state.done.length} / ${QUESTS.length} 達成）`);
  QUESTS.forEach((q,i) => {
    lines.push(`- [${state.done.includes(i)?'x':' '}] ${q.name}`);
  });
  lines.push('');
  lines.push(`## その他の記録`);
  lines.push(`- インパス診断ツール使用回数: ${state.impassCount||0}回`);
  lines.push(`- デートマインドマップ作成回数: ${state.mindmapCount||0}回`);
  lines.push('');
  lines.push(`---`);
  lines.push(`## 💾 セーブデータ（この下のブロックは編集・削除しないでください。読込時に使用します）`);
  lines.push('```json');
  lines.push(JSON.stringify(state, null, 2));
  lines.push('```');
  lines.push('');
  return lines.join('\n');
}
let savedFileHandle = null; // File System Access API対応ブラウザ(PC)で、2回目以降は同じファイルに無言で上書きするための保存先ハンドル

async function saveBookFile(){
  const md = buildBookMarkdown();
  const av = AVATARS[state.avatarIdx];
  const stamp = new Date().toISOString().slice(0,10);
  const filename = `冒険の書_${av.name}_${stamp}.md`;

  // 対応ブラウザ(PC): 既に保存先が決まっていればダイアログなしで上書き、初回だけ保存先を選ばせる
  if(window.showSaveFilePicker){
    try{
      if(!savedFileHandle){
        savedFileHandle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{description:'Markdown', accept:{'text/markdown':['.md']}}]
        });
      }
      const writable = await savedFileHandle.createWritable();
      await writable.write(md);
      await writable.close();
      alert('冒険の書を上書き保存しました📖\n' + savedFileHandle.name);
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // ユーザーがキャンセル
      savedFileHandle = null; // 失敗時は保存先情報を破棄し、次回また選び直させる
      // 非対応・失敗時は下のダウンロードにフォールバック
    }
  }

  // フォールバック(モバイル等・非対応ブラウザ): 毎回新規ダウンロード
  const blob = new Blob([md], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  alert('冒険の書のダウンロードを開始しました📖\n' + filename
    + '\n\nブラウザに表示される保存の確認・通知に従って完了してください（既定はダウンロードフォルダ）。');
}
function loadBookFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    const m = text.match(/```json\s*([\s\S]*?)```/);
    if(!m){ alert('セーブデータ（JSONブロック）が見つかりませんでした。冒険の書ファイルを選択してください。'); return; }
    let parsed;
    try{ parsed = JSON.parse(m[1]); }
    catch(e){ alert('セーブデータの読み込みに失敗しました。ファイルが壊れている可能性があります。'); return; }
    state = normalizeState(parsed);
    save(); renderAll();
    alert('冒険の書を読み込みました📖');
  };
  reader.onerror = () => alert('ファイルの読み込みに失敗しました。');
  reader.readAsText(file, 'utf-8');
}

// リロードボタン(ホーム画面追加時のスタンドアロン表示にはブラウザのリロードUIがないため)
document.getElementById('reloadBtn').addEventListener('click', () => {
  location.href = location.pathname + '?t=' + Date.now();
});

// ─── INIT ────────────────────────────────────────────
load();
buildModal();
if(localStorage.getItem('lqm')){
  document.getElementById('modal').style.display = 'none';
} else {
  document.getElementById('modal').style.display = 'flex';
}
renderAll();
</script>
